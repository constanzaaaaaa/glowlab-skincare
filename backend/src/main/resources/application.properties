spring.application.name=glowlab-backend
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/glowlab}
spring.datasource.username=${DB_USERNAME:glowlab}
spring.datasource.password=${DB_PASSWORD:glowlab_dev}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
springdoc.swagger-ui.path=/swagger-ui.html
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
app.jwt.secret-base64=${JWT_SECRET_BASE64}
app.security.cookie-secure=${COOKIE_SECURE:false}
app.bootstrap.admin-email=${ADMIN_EMAIL:}
app.bootstrap.admin-password=${ADMIN_PASSWORD:}
app.bootstrap.admin-run=${ADMIN_RUN:123456785}
