name: Control 3 - validar backend y frontend

on:
  push:
    branches: [control-3-spring-rest-jwt]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Spring Boot 21 - compilar y probar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Ejecutar pruebas del backend con H2
        run: mvn -B -ntp -f backend/pom.xml clean verify
      - name: Guardar resultados de Maven y JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-control3-spring
          path: |
            backend/target/surefire-reports/
            backend/target/site/jacoco/
          if-no-files-found: warn

  frontend:
    name: React - instalación y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias fijadas
        working-directory: frontend
        run: npm ci
      - name: Verificar compilación de React
        working-directory: frontend
        run: npm run build
      - name: Ejecutar Jasmine y Karma con ChromeHeadless y cobertura
        working-directory: frontend
        run: npm run test:coverage
      - name: Guardar cobertura Karma
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-control3-react
          path: frontend/coverage/
          if-no-files-found: warn
