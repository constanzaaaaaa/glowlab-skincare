name: Control 3 - validar backend y frontend

on:
  push:
    branches: [control-3-spring-rest-jwt]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Spring Boot 21 - compilar y probar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Ejecutar pruebas del backend con H2
        run: mvn -B -ntp -f backend/pom.xml clean verify
      - name: Guardar resultados de Maven y JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-control3-spring
          path: |
            backend/target/surefire-reports/
            backend/target/site/jacoco/
          if-no-files-found: warn

  frontend:
    name: React - instalación y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias fijadas
        working-directory: frontend
        run: npm ci
      - name: Verificar compilación de React
        working-directory: frontend
        run: npm run build
      - name: Ejecutar Jasmine y Karma con ChromeHeadless y cobertura
        working-directory: frontend
        run: npm run test:coverage
      - name: Guardar cobertura Karma
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-control3-react
          path: frontend/coverage/
          if-no-files-found: warn

  mysql-integracion:
    name: Spring Boot y MySQL real - API y roles
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: glowlab
          MYSQL_USER: glowlab
          MYSQL_PASSWORD: ci-glowlab
          MYSQL_ROOT_PASSWORD: ci-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/glowlab
      DB_USERNAME: glowlab
      DB_PASSWORD: ci-glowlab
      JWT_SECRET_BASE64: AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA=
      ADMIN_EMAIL: admin@gmail.com
      ADMIN_PASSWORD: ClavePruebaSoloCI2026
      VENDEDOR_EMAIL: vendedor@gmail.com
      VENDEDOR_PASSWORD: ClaveVendedorSoloCI2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Empaquetar API Spring
        run: mvn -B -ntp -f backend/pom.xml -DskipTests package
      - name: Iniciar API con MySQL y esperar respuesta
        run: |
          nohup java -jar backend/target/glowlab-backend-1.0.0.jar > /tmp/glowlab-control3.log 2>&1 &
          echo $! > /tmp/glowlab-control3.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/v1/productos > /tmp/glowlab-catalogo.json; then
              echo "Spring Boot y MySQL responden"
              exit 0
            fi
            sleep 2
          done
          echo "No se pudo iniciar Spring Boot con MySQL"
          cat /tmp/glowlab-control3.log
          exit 1
      - name: Probar CRUD, usuarios JWT, órdenes y stock en MySQL
        run: python3 backend/scripts/smoke_mysql.py
      - name: Guardar log de integración MySQL
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-control3-mysql
          path: /tmp/glowlab-control3.log
          if-no-files-found: warn

  entregables-codigo:
    name: Generar 07 y 08 desde el commit real
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crear ZIP de frontend y backend con archivos versionados
        run: |
          git archive --format=zip --prefix=frontend/ -o 07-Proyecto-frontend-comprimido.zip HEAD:frontend
          git archive --format=zip --prefix=backend/ -o 08-Proyecto-backend-comprimido.zip HEAD:backend
          unzip -t 07-Proyecto-frontend-comprimido.zip | tail -n 1
          unzip -t 08-Proyecto-backend-comprimido.zip | tail -n 1
      - name: Publicar código comprimido para entrega
        uses: actions/upload-artifact@v4
        with:
          name: codigo-control3-07-08
          path: |
            07-Proyecto-frontend-comprimido.zip
            08-Proyecto-backend-comprimido.zip
          if-no-files-found: error
